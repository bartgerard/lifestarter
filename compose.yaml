# Lifestarter as two containers:
#
#   web    nginx  – serves the Angular bundle and reverse-proxies /api to the backend
#   server        – the Spring Boot API; deliberately not published, nginx is the only way in
#
# Everything is configured through .env (copy .env.example). Start it with:
#
#   docker compose up -d --build
#
name: lifestarter

services:
  web:
    build:
      context: ./client
    image: lifestarter-web:latest
    environment:
      # Must match the backend service name; nginx re-resolves it on every request.
      API_UPSTREAM: http://server:8080
    ports:
      - "${LIFESTARTER_HTTP_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  server:
    build:
      # The repository root: the build needs the aggregator pom next to server/.
      context: .
      dockerfile: server/Dockerfile
    image: lifestarter-server:latest
    environment:
      LIFESTARTER_PERSISTENCE_TYPE: "${LIFESTARTER_PERSISTENCE_TYPE:-sqlite}"
      # Inside the volume, so the database outlives the container.
      LIFESTARTER_PERSISTENCE_SQLITE_PATH: /var/lib/lifestarter/lifestarter.db
      LIFESTARTER_SECURITY_ADMIN_USERNAME: "${LIFESTARTER_SECURITY_ADMIN_USERNAME:-admin}"
      LIFESTARTER_SECURITY_ADMIN_PASSWORD: "${LIFESTARTER_SECURITY_ADMIN_PASSWORD:-}"
      LIFESTARTER_MONGODB_URI: "${LIFESTARTER_MONGODB_URI:-mongodb://mongo:27017}"
      LIFESTARTER_MONGODB_DATABASE: "${LIFESTARTER_MONGODB_DATABASE:-lifestarter}"
      # Confirmation mail is skipped entirely while SPRING_MAIL_HOST is empty.
      SPRING_MAIL_HOST: "${SPRING_MAIL_HOST:-}"
      SPRING_MAIL_PORT: "${SPRING_MAIL_PORT:-587}"
      SPRING_MAIL_USERNAME: "${SPRING_MAIL_USERNAME:-}"
      SPRING_MAIL_PASSWORD: "${SPRING_MAIL_PASSWORD:-}"
      TZ: "${TZ:-Europe/Brussels}"
    volumes:
      # Defaults to the named volume below. Put an absolute or ./relative path in LIFESTARTER_DATA
      # and Compose turns this into a bind mount instead — see the README.
      - "${LIFESTARTER_DATA:-lifestarter-data}:/var/lib/lifestarter"
    restart: unless-stopped

  # Only started with `docker compose --profile mongodb up -d`, for
  # LIFESTARTER_PERSISTENCE_TYPE=mongodb.
  mongo:
    profiles: [ mongodb ]
    image: mongo:8
    volumes:
      - lifestarter-mongo-data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  # `docker volume inspect lifestarter_lifestarter-data` prints the host location.
  lifestarter-data:
  lifestarter-mongo-data:
